<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cayden — hero source</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#fff;color:#1f2328;
       font:15px/1.7 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}
  .page{max-width:1040px;margin:0 auto;padding:32px 16px 72px}
  .card{border:1px solid #d1d9e0;border-radius:6px;overflow:hidden}
  #word{display:block;width:100%;height:auto}

                          </style>
<style>
.hero-live{--ink:#191919;--red:#df3327;--blue:#1746a1;--yellow:#f1cd30;overflow:hidden;isolation:isolate}

.hero-live .red-fill{fill:var(--red)}.hero-live .yellow-fill{fill:var(--yellow)}.hero-live .blue-fill{fill:var(--blue)}

.hero-live .ink-stroke{fill:none;stroke:var(--ink);stroke-linecap:butt}

.hero-live #name path,.hero-live #name use,.hero-live defs>path{fill:none;stroke-width:8.2;stroke-linecap:square;stroke-linejoin:round}



/* Geometry follows its own axes; text and reading positions stay still. */

.art .red-fill { transform-box:fill-box; transform-origin:center; animation:red-step 8s ease-in-out infinite; }

.art .yellow-fill { transform-box:fill-box; transform-origin:center; }

.art .yellow-fill:nth-of-type(2) { transform-origin:top center; animation:yellow-rise 10s ease-in-out -2s infinite; }

.art .yellow-fill:nth-of-type(3) { animation:yellow-slide 9s ease-in-out -1s infinite; }

.art .blue-fill { transform-box:fill-box; transform-origin:center; animation:blue-diagonal 9s ease-in-out -1.5s infinite; }

.art .ink-stroke path { transform-box:fill-box; }

.art .axis-primary { transform-origin:top center; animation:vertical-length 10s ease-in-out -1s infinite; }

.art .line-under-red { transform-origin:left center; animation:horizontal-length 8s ease-in-out -2s infinite; }

.art .axis-break { transform-origin:bottom center; animation:vertical-length 10s ease-in-out -6s infinite; }

.art .line-heavy { transform-origin:left center; animation:horizontal-length 9s ease-in-out -1s infinite; }

.art .line-fine { transform-origin:left center; animation:fine-length 11s ease-in-out -4s infinite; }

.art .line-high { transform-origin:right center; animation:fine-length 10s ease-in-out -2s infinite; }

.art .axis-right { transform-origin:top center; animation:vertical-length 8s ease-in-out -3s infinite; }

.art .axis-right-break { animation:vertical-shift 8s ease-in-out -3s infinite; }

.art .axis-low { transform-origin:bottom center; animation:vertical-length 11s ease-in-out -5s infinite; }

.art .axis-yellow { animation:vertical-shift 9s ease-in-out -1s infinite; }

.art .line-low { transform-origin:left center; animation:horizontal-length 9s ease-in-out -4s infinite; }

.art .diagonal-near { animation:diagonal-near 9s ease-in-out -1.5s infinite; }

.art .diagonal-far { animation:diagonal-far 9s ease-in-out -1.5s infinite; }

@keyframes red-step {

  0%,100% { transform:translate(0,0); }

  25% { transform:translate(12px,0); }

  50% { transform:translate(12px,9px); }

  75% { transform:translate(0,9px); }

}

@keyframes yellow-rise { 0%,100% { transform:translateY(0) scaleY(1); } 50% { transform:translateY(12px) scaleY(.87); } }

@keyframes yellow-slide { 0%,100% { transform:translateX(0); } 50% { transform:translateX(18px); } }

@keyframes blue-diagonal { 0%,100% { transform:translate(0,0) rotate(0); } 50% { transform:translate(-18px,18px) rotate(-3deg); } }

@keyframes vertical-length { 0%,100% { transform:scaleY(1); } 50% { transform:scaleY(.82); } }

@keyframes horizontal-length { 0%,100% { transform:scaleX(1); } 50% { transform:scaleX(.76); } }

@keyframes fine-length { 0%,100% { transform:scaleX(1); } 50% { transform:scaleX(.83); } }

@keyframes vertical-shift { 0%,100% { transform:translateY(0); } 50% { transform:translateY(9px); } }

@keyframes diagonal-near { 0%,100% { transform:translate(0,0); } 50% { transform:translate(-12px,12px); } }

@keyframes diagonal-far { 0%,100% { transform:translate(0,0); } 50% { transform:translate(6px,-6px); } }

/* Three held compositions, connected by decisive movement. */

.art { --beat:6.8s; --snap:cubic-bezier(.7,0,.2,1); }

.art .red-fill { animation:red-compose var(--beat) var(--snap) infinite; }

.art .yellow-fill:nth-of-type(2) { transform-origin:center; animation:yellow-turn var(--beat) var(--snap) -.15s infinite; }

.art .yellow-fill:nth-of-type(3) { animation:yellow-travel var(--beat) var(--snap) -.3s infinite; }

.art .blue-fill { animation:blue-compose var(--beat) var(--snap) -.12s infinite; }

.art .axis-primary { animation:primary-cut var(--beat) var(--snap) infinite; }

.art .line-under-red { animation:red-baseline var(--beat) var(--snap) infinite; }

.art .axis-break { animation:break-shift var(--beat) var(--snap) infinite; }

.art .line-heavy { animation:heavy-cut var(--beat) var(--snap) -.15s infinite; }

.art .line-fine { animation:fine-cut var(--beat) var(--snap) -.15s infinite; }

.art .line-high { animation:high-cut var(--beat) var(--snap) -.15s infinite; }

.art .axis-right { animation:right-cut var(--beat) var(--snap) infinite; }

.art .axis-right-break { animation:right-break var(--beat) var(--snap) infinite; }

.art .axis-low { animation:low-cut var(--beat) var(--snap) -.3s infinite; }

.art .axis-yellow { animation:yellow-axis var(--beat) var(--snap) -.3s infinite; }

.art .line-low { animation:low-baseline var(--beat) var(--snap) -.3s infinite; }

.art .diagonal-near { transform-origin:center; animation:diagonal-compose-a var(--beat) var(--snap) -.12s infinite; }

.art .diagonal-far { transform-origin:center; animation:diagonal-compose-b var(--beat) var(--snap) -.12s infinite; }

@keyframes red-compose {

  0%,8%,100% { transform:translate(0,0) scale(1) rotate(0); }

  26%,36% { transform:translate(-20px,50px) scale(.72,1.12) rotate(0); }

  55%,65% { transform:translate(25px,58px) scale(1.12,.5) rotate(0); }

  82%,88% { transform:translate(10px,-12px) scale(.78) rotate(90deg); }

}

@keyframes blue-compose {

  0%,8%,100% { transform:translate(0,0) rotate(0) scale(1); }

  26%,36% { transform:translate(-128px,45px) rotate(0) scale(.86); }

  55%,65% { transform:translate(-100px,-52px) rotate(45deg) scale(1.05); }

  82%,88% { transform:translate(-20px,-6px) rotate(-12deg) scale(.85); }

}

@keyframes yellow-turn {

  0%,8%,100% { transform:translate(0,0) rotate(0) scale(1); }

  26%,36% { transform:translate(-128px,15px) rotate(90deg) scale(1.15,.8); }

  55%,65% { transform:translate(-45px,22px) rotate(90deg) scale(.7,1.6); }

  82%,88% { transform:translate(-20px,12px) rotate(0) scale(.55,1.4); }

}

@keyframes yellow-travel {

  0%,8%,100% { transform:translate(0,0) scale(1); }

  26%,36% { transform:translate(210px,16px) scale(.55,2.5); }

  55%,65% { transform:translate(65px,28px) scale(1.3,.65); }

  82%,88% { transform:translate(128px,-3px) scale(.4,1.8); }

}

@keyframes primary-cut {

  0%,8%,100% { transform:translateX(0) scaleY(1); }

  26%,36% { transform:translateX(-32px) scaleY(.44); }

  55%,65% { transform:translateX(2px) scaleY(1.16); }

  82%,88% { transform:translateX(-12px) scaleY(.68); }

}

@keyframes red-baseline {

  0%,8%,100% { transform:translateY(0) scaleX(1); }

  26%,36% { transform:translateY(35px) scaleX(.6); }

  55%,65% { transform:translateY(12px) scaleX(1.25); }

  82%,88% { transform:translateY(-20px) scaleX(.3); }

}

@keyframes break-shift {

  0%,8%,100% { transform:translateX(0) scaleY(1); }

  26%,36% { transform:translateX(-32px) scaleY(1.1); }

  55%,65% { transform:translateX(16px) scaleY(.35); }

  82%,88% { transform:translateX(-12px) scaleY(.6); }

}

@keyframes heavy-cut {

  0%,8%,100% { transform:scaleX(1); }

  26%,36% { transform:scaleX(1.9); }

  55%,65% { transform:scaleX(.3); }

  82%,88% { transform:scaleX(1.35); }

}

@keyframes fine-cut {

  0%,8%,100% { transform:translate(0,16px) scaleX(1); }

  26%,36% { transform:translate(125px,20px) scaleX(.35); }

  55%,65% { transform:translate(-25px,18px) scaleX(1.4); }

  82%,88% { transform:translate(55px,14px) scaleX(.65); }

}

@keyframes high-cut {

  0%,8%,100% { transform:translateX(0) scaleX(1); }

  26%,36% { transform:translateX(-75px) scaleX(.25); }

  55%,65% { transform:translateX(25px) scaleX(.8); }

  82%,88% { transform:translateX(-40px) scaleX(.45); }

}

@keyframes right-cut {

  0%,8%,100% { transform:scaleY(1); }

  26%,36% { transform:scaleY(.35); }

  55%,65% { transform:scaleY(1.7); }

  82%,88% { transform:scaleY(.75); }

}

@keyframes right-break {

  0%,8%,100% { transform:translateY(0) scaleY(1); }

  26%,36% { transform:translateY(-65px) scaleY(1.3); }

  55%,65% { transform:translateY(38px) scaleY(.5); }

  82%,88% { transform:translateY(-25px) scaleY(1.6); }

}

@keyframes low-cut {

  0%,8%,100% { transform:scaleY(1); }

  26%,36% { transform:scaleY(.35); }

  55%,65% { transform:scaleY(1.2); }

  82%,88% { transform:scaleY(.55); }

}

@keyframes yellow-axis {

  0%,8%,100% { transform:translateX(0); }

  26%,36% { transform:translateX(160px); }

  55%,65% { transform:translateX(30px); }

  82%,88% { transform:translateX(105px); }

}

@keyframes low-baseline {

  0%,8%,100% { transform:scaleX(1); }

  26%,36% { transform:scaleX(3.5); }

  55%,65% { transform:scaleX(.4); }

  82%,88% { transform:scaleX(2.2); }

}

@keyframes diagonal-compose-a {

  0%,8%,100% { transform:translate(0,0) rotate(0) scale(1); }

  26%,36% { transform:translate(-90px,30px) rotate(45deg) scale(.55); }

  55%,65% { transform:translate(-40px,-15px) rotate(0) scale(1.25); }

  82%,88% { transform:translate(0,0) rotate(-15deg) scale(.7); }

}

@keyframes diagonal-compose-b {

  0%,8%,100% { transform:translate(0,0) rotate(0) scale(1); }

  26%,36% { transform:translate(-24px,42px) rotate(-45deg) scale(.9); }

  55%,65% { transform:translate(-62px,-16px) rotate(45deg) scale(.65); }

  82%,88% { transform:translate(0,0) rotate(-15deg) scale(.6); }

}

/* A clear interval separates the blue plane from its single main diagonal. */

@keyframes blue-compose {

  0%,3%,100% { transform:translate(0,0) rotate(0) scale(1); }

  26%,30% { transform:translate(-128px,45px) rotate(0) scale(.86); }

  55%,59% { transform:translate(-84px,-28px) rotate(45deg) scale(1.05); }

  82%,85% { transform:translate(-20px,-6px) rotate(-12deg) scale(.85); }

}

@keyframes diagonal-compose-a {

  0%,3%,100% { transform:translate(0,0) rotate(0) scale(1); }

  26%,30% { transform:translate(-130px,30px) rotate(45deg) scale(.55); }

  55%,59% { transform:translate(-90px,15px) rotate(0) scale(.95); }

  82%,85% { transform:translate(0,0) rotate(-15deg) scale(.7); }

}

.hero-live .art *{animation-play-state:paused!important}

.hero-live .type-rail{transform-box:fill-box;transform-origin:left center;animation:profile-type-rail 6.8s cubic-bezier(.45,0,.2,1) infinite}

@keyframes profile-type-rail{0%,3%,100%{transform:scaleX(1)}26%,30%{transform:scaleX(.4)}55%,59%{transform:scaleX(.8)}82%,85%{transform:scaleX(.6)}}


/* ---- 座右铭：几何无衬线，字号由 JS 按槽宽自适应 ---- */
.motto-integrated{font:700 34px "Century Gothic","Tw Cen MT","Avenir Next",sans-serif;
                  letter-spacing:-.2px;fill:var(--ink)}

.hero-live .art .line-fine{animation:motto-leading-rule 6.8s cubic-bezier(.7,0,.2,1) infinite;transform-origin:right center}
.hero-live .art .motto-tail-rule{transform-box:fill-box;transform-origin:left center;animation:motto-trailing-rule 6.8s cubic-bezier(.7,0,.2,1) infinite}
@keyframes motto-leading-rule{0%,8%,100%{transform:scaleX(1)}26%,36%{transform:scaleX(.38)}55%,65%{transform:scaleX(1.25)}82%,88%{transform:scaleX(.6)}}

@keyframes motto-trailing-rule{0%,8%,100%{transform:scaleX(1)}26%,36%{transform:scaleX(.46)}55%,65%{transform:scaleX(.8)}82%,88%{transform:scaleX(.6)}}


</style>
</head>
<body>
<!-- hero 源文件：assets/hero.gif 由这个文件逐帧导出（window.heroSeek(p) 冻结到任意相位，p∈[0,1) 对应 11.5s 一圈） -->
<div class="page">
<div class="card">
<svg class="hero-gif hero-live" id="word" viewBox="0 0 1040 340" width="1040" height="340" role="img" aria-labelledby="hero-title">
<title id="hero-title">Cayden. Work hard in silence. Let success be your noise.</title>
<defs></defs><g class="art" aria-hidden="true">
  <rect class="red-fill" x="42" y="24" width="135" height="115"/>
  <rect class="yellow-fill" x="950" y="18" width="42" height="52"/>
  <rect class="yellow-fill" x="40" y="280" width="135" height="23"/>
  <!-- ① 蓝菱形：对角线 119.6 → 74，并转 12°，边不再平行于 45° 粗斜杆 -->
  <polygon class="blue-fill" points="971.2,266.0 920.0,255.2 930.9,204.0 982.0,214.9"/>
  <g class="ink-stroke">
    <path class="axis-primary" d="M230 0V130" stroke-width="9"/>
    <path class="line-under-red" d="M0 150H205" stroke-width="5"/>
    <path class="axis-break" d="M230 172V209" stroke-width="9"/>
    <path class="line-heavy" d="M0 185H161" stroke-width="10"/>
    <path class="line-fine" d="M0 241H26" stroke-width="2"/>
    <!-- ② 咬合：原来 M570 18H917 悬在字上方 11.8px 的横杆，落到 'd' 竖顶 y=29.8，
         左端接到 x=230 的主轴、右端抵住右上黄块的左边缘 950 —— 一条线同时咬住字、轴、面 -->
    <path class="line-high" d="M570 18H917" stroke-width="2"/>
    <path class="axis-right" d="M994 0V115" stroke-width="6"/>
    <path class="axis-right-break" d="M994 145V190" stroke-width="3"/>
    <path class="axis-low" d="M230 290V340" stroke-width="3"/>
    <path class="axis-yellow" d="M91 274V329" stroke-width="7"/>
    <path class="line-low" d="M0 318H91" stroke-width="2"/>
    <path class="diagonal-near" d="M772 324L881 215" stroke-width="12"/>
    <path class="motto-tail-rule" d="M668 241H742" stroke-width="2"/>
    <path class="type-rail" d="M803.84 153H994" stroke-width="3"/>
  </g>
</g>
<g id="name" transform="translate(250 24) scale(.72 .6912)" aria-hidden="true"></g>
<g class="hero-claim" aria-hidden="true"><text class="motto-integrated" x="42" y="254">Work hard in silence. Let success be your noise<tspan fill="#df3327">.</tspan></text></g>
<rect class="name-dot" x="785.84" y="145" width="15" height="15" fill="#df3327" aria-hidden="true"/>
</svg>
</div>
</div>

<script>(()=>{
const NS='http://www.w3.org/2000/svg';
const node=(tag,parent,attrs={})=>{const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);parent.append(e);return e};
const clamp=x=>x<0?0:x>1?1:x;
const ease=x=>{x=clamp(x);return x*x*x*(x*(x*6-15)+10)};
const mix=(a,b,t)=>'rgb('+a.map((v,i)=>Math.round(v+(b[i]-v)*t)).join(',')+')';
const tan=(a,b)=>{const d=Math.hypot(b[0]-a[0],b[1]-a[1])||1;return[(b[0]-a[0])/d,(b[1]-a[1])/d]};
const xy=p=>p.map(v=>v.toFixed(2)).join(' ');

const letterData=[["C",0,["M107 47.9167C95 34.375 79 27.0833 62 27.0833C28 27.0833 5 55.2083 5 91.6667C5 128.125 28 156.25 62 156.25C80 156.25 95 148.9583 107 135.4167"]],["a",134,["M44 155.7292C24 155.7292 10 139.5833 10 118.75C10 97.9167 24 81.25 44 81.25C64 81.25 78 97.9167 78 118.75C78 139.5833 64 155.7292 44 155.7292","M32 70.8333H98V154.1667"]],["y",265,["M12 70.8333C16 100 28 125 51 132.2917","M94 70.8333C86 102.0833 73 130.2083 58 156.25L32 197.9167"]],["d",362,["M83 156.25C60 156.25 43 137.5 43 112.5C43 87.5 60 68.75 83 68.75","M104 8.3333V154.1667"]],["e",486,["M80 148.9583C63 162.5 40 158.3333 28 140.625C17 126.0417 17 103.125 27 87.5C39 68.75 61 63.5417 80 72.9167C94 80.2083 102 94.7917 102 110.4167H32"]],["n",614,["M20 154.1667V70.8333","M33 82.2917L40 76.0417C48 69.7917 60 68.75 75 68.75C98 68.75 112 81.25 112 104.1667V154.1667"]]];
const BLUE=['C','a','y'];
const palette={blue:[23,70,161],red:[223,51,39]};
const source=letterData.flatMap(([letter,x,paths])=>paths.map((d,i)=>({letter,x,d,part:i,blue:BLUE.includes(letter)})));
const col=s=>s.blue?palette.blue:palette.red;

const root=document.getElementById('name');
const defs=document.querySelector('#word defs');

/* 每笔采样成折线，两端各沿切线延长半笔宽（4.1），再用 butt cap 画 —— 精确复刻原版方头端点的字形，
   但收缩到 0 时不会留下一个方块残点。 */
const EXT=4.1, STEP_L=.25;
/* 笔画本体仍是原来的贝塞尔（栅格化不变），只在两端各追加 4.1 的直线段 —— 等效于原来的方头端点，
   但换成 butt cap 之后，dash 收缩到 0 时不会留下一个方块残点。 */
const geo=source.map(s=>{
  const t=node('path',defs,{d:s.d,fill:'none'});
  const L=t.getTotalLength(), pts=[], ptsU=[];
  for(let i=0,n=Math.ceil(L/STEP_L);i<=n;i++){
    const p=t.getPointAtLength(L*i/n);
    pts.push([p.x+s.x,p.y]); ptsU.push([p.x,p.y]);
  }
  const p0=t.getPointAtLength(0), p1=t.getPointAtLength(.6);
  const q1=t.getPointAtLength(L-.6), q0=t.getPointAtLength(L);
  t.remove();
  const b0=tan([p1.x,p1.y],[p0.x,p0.y]), b1=tan([q1.x,q1.y],[q0.x,q0.y]);
  const ex=(arr,bA,bB)=>[[arr[0][0]+bA[0]*EXT,arr[0][1]+bA[1]*EXT],...arr,[arr.at(-1)[0]+bB[0]*EXT,arr.at(-1)[1]+bB[1]*EXT]];
  const ext=ex(pts,b0,b1), extU=ex(ptsU,b0,b1);
  /* 路径本体保持原始坐标（由外层的 translate 负责平移），只在两端追加 4.1 的直线段 */
  const d='M'+xy(extU[0])+'L'+xy(ptsU[0])+s.d.replace(/^M[^A-Za-z]*/,'')+'L'+xy(extU.at(-1));
  const probe=node('path',defs,{d,fill:'none'});
  const extL=probe.getTotalLength(); probe.remove();
  const probe2=node('path',defs,{d:'M'+ext.map(xy).join('L'),fill:'none'});
  const polyL=probe2.getTotalLength(); probe2.remove();
  return {pts,ptsU,ext,extL,polyL,d};
});

const canonical=node('g',root,{id:'canonical'});
const canonicalPaths=geo.map((g,i)=>node('path',canonical,{d:g.d,fill:'none',
  transform:`translate(${source[i].x} 0)`,
  stroke:mix(col(source[i]),col(source[i]),0),style:'stroke-linecap:butt'}));

const guides=node('g',root,{opacity:0,id:'guides'});
source.forEach(s=>node('path',guides,{d:s.d,transform:`translate(${s.x} 0)`,stroke:'#191919'}));

/* 双射，且每一对互为同一拍 —— 这样某一笔离场和另一笔补位发生在同一个 u 上，
   空洞时长从原来的 4.12s（'a' 的横杆，那段时间名字读作 "Coyden"）收敛到 1.2s 左右。 */
const destination=[7,5,6,9,8,1,2,0,4,3];
const beat=[0,1,3,2,4,1,3,0,4,2];
const lanes=[221,193,-14,22,229,26,208,-19,-20,223].map(y=>y/.96);
const fillOf=[]; destination.forEach((d,i)=>{fillOf[d]=i});

const flights=source.map((s,i)=>{
  const tg=destination[i], A=geo[i], B=geo[tg];
  const end=A.ext.at(-1), start=B.ext[0];
  const ta=tan(A.ext.at(-2),end), tb=tan(start,B.ext[1]);
  const dir=Math.sign(start[0]-end[0])||1;
  const reach=Math.min(88,Math.abs(start[0]-end[0])*.26), lane=lanes[i];
  const sourceD='M'+A.ext.map(xy).join('L');
  const route=`C${xy([end[0]+ta[0]*28,end[1]+ta[1]*28])} ${xy([end[0]+dir*reach*.6,lane])} ${xy([end[0]+dir*reach,lane])}`+
              `L${xy([start[0]-dir*reach,lane])}`+
              `C${xy([start[0]-dir*reach*.6,lane])} ${xy([start[0]-tb[0]*28,start[1]-tb[1]*28])} ${xy(start)}`;
  const railD=sourceD+route+'L'+B.ext.slice(1).map(xy).join('L');

  const rail=node('path',defs,{id:'rail-'+i,d:railD,fill:'none'});
  const total=rail.getTotalLength();
  const probe=node('path',defs,{d:sourceD,fill:'none'});
  const sourceLength=probe.getTotalLength(); probe.remove();
  const probe2=node('path',defs,{d:sourceD+route,fill:'none'});
  const targetStart=probe2.getTotalLength(); probe2.remove();

  const tint=node('linearGradient',defs,{id:'tint-'+i,gradientUnits:'userSpaceOnUse'});
  const tintStops=[node('stop',tint,{offset:0}),node('stop',tint,{offset:1})];
  const fade=node('linearGradient',defs,{id:'fade-'+i,gradientUnits:'userSpaceOnUse'});
  const fadeStop=node('stop',fade,{offset:0,'stop-color':'white'});
  node('stop',fade,{offset:1,'stop-color':'white'});
  const mask=node('mask',defs,{id:'mask-'+i,maskUnits:'userSpaceOnUse',x:-100,y:-50,width:1100,height:450});
  node('rect',mask,{x:-100,y:-50,width:1100,height:450,fill:'url(#fade-'+i+')'});

  const trail=node('use',root,{href:'#rail-'+i,stroke:'url(#tint-'+i+')',mask:'url(#mask-'+i+')',style:'stroke-linecap:butt'});
  return {s,t:source[tg],rail,total,sourceLength,targetStart,tintStops,fade,fadeStop,trail,
          begin:.08+beat[i]*.12};
});

const DUR=.30;
const heads=new Array(flights.length).fill(0);

function render(q){
  guides.setAttribute('opacity',(0.045*Math.sin(Math.PI*q)**2).toFixed(4));

  flights.forEach((f,i)=>{
    const t=ease((q-f.begin)/DUR);
    const tail=f.targetStart*t;
    const head=f.sourceLength+(f.total-f.sourceLength)*t;
    heads[i]=head;
    const tp=f.rail.getPointAtLength(tail), hp=f.rail.getPointAtLength(head);
    const dist=Math.hypot(hp.x-tp.x,hp.y-tp.y);
    const fading=Math.sin(Math.PI*t)**.7;
    f.fade.setAttribute('x1',tp.x);f.fade.setAttribute('y1',tp.y);
    f.fade.setAttribute('x2',hp.x+(dist<.01?.01:0));f.fade.setAttribute('y2',hp.y);
    f.fadeStop.setAttribute('stop-opacity',String(1-fading*.88*Math.min(1,dist/30)));
    const landing=ease((head-f.targetStart)/(f.total-f.targetStart));
    f.tintStops[0].setAttribute('stop-color',mix(col(f.s),col(f.t),landing));
    f.tintStops[1].setAttribute('stop-color',mix(col(f.s),col(f.t),ease(t/.2)));
    f.trail.setAttribute('stroke-dasharray',`${Math.max(0,head-tail)} ${f.total+1}`);
    f.trail.setAttribute('stroke-dashoffset',String(-tail));
  });

  /* 笔画本体：靠 dash 收缩/生长，没有任何 display 切换 —— 换帧时不会整字重绘 */
  canonicalPaths.forEach((p,j)=>{
    const g=flights[fillOf[j]];
    const t=ease((q-flights[j].begin)/DUR);
    /* 收缩/生长量按“折线长度”算，再换算到这条路径自己的长度上 */
    const k=geo[j].extL/geo[j].polyL;
    const retract=geo[j].polyL*(1-ease(t/.28));
    const delivered=clamp(heads[fillOf[j]]-g.targetStart,0,geo[j].polyL);
    const vis=Math.max(retract,delivered)*k;
    p.setAttribute('stroke-dasharray',`${vis.toFixed(2)} ${(geo[j].extL+2).toFixed(2)}`);
  });
}

/* 座右铭自适应槽宽 */
const motto=document.querySelector('.motto-integrated');
const tailRule=document.querySelector('.motto-tail-rule');
let fs=34;
for(let i=0;i<60&&motto.getBBox().width>620;i++){fs-=.5;motto.style.fontSize=fs+'px'}
{const b=motto.getBBox(),x=Math.round(b.x+b.width+14);
 tailRule.setAttribute('d',`M${x} 241H${x+74}`);}

/* 一个钟：几何层的 CSS 动画只被这个钟拨动，不再自己走 */
const geometry=document.querySelector('.art').getAnimations({subtree:true});
geometry.forEach(a=>{a.pause();a.currentTime=0});

const PERIOD=11500, HOLD=.24;
const remap=p=>clamp((p-HOLD)/(1-HOLD));

let phase=0,last=0,running=!matchMedia('(prefers-reduced-motion:reduce)').matches;
function paint(p){
  phase=p;
  const q=remap(p);
  render(q);
  geometry.forEach(a=>{a.currentTime=(q>=1?0:q)*6800});
}
window.heroSeek=p=>{running=false;paint(p)};

paint(0);
if(running)requestAnimationFrame(function tick(now){
  if(!last)last=now;
  const dt=Math.min(60,now-last);last=now;
  paint((phase+dt/PERIOD)%1);
  requestAnimationFrame(tick);
});
})();</script>
